services:
  postgres:
    image: postgres:15
    container_name: adm-tool-postgres
    environment:
      POSTGRES_DB: admtool
      POSTGRES_USER: admtool
      POSTGRES_PASSWORD: admtool
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - admnet
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admtool -d admtool" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: osiedledesk-backend:latest
    container_name: osiedledesk-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-admtool}
      DB_USERNAME: ${DB_USER:-admtool}
      DB_PASSWORD: ${DB_PASSWORD:-admtool}
      GMAIL_CLIENT_ID: ${GMAIL_CLIENT_ID:-}
      GMAIL_CLIENT_SECRET: ${GMAIL_CLIENT_SECRET:-}
      GMAIL_REFRESH_TOKEN: ${GMAIL_REFRESH_TOKEN:-}
      GMAIL_SENDER_EMAIL: ${GMAIL_SENDER_EMAIL:-}
      ADMIN_COMPANY_EMAIL: ${ADMIN_COMPANY_EMAIL:-admin@example.com}
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost
    ports:
      - "8080:8080"
    networks:
      - admnet
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: osiedledesk-frontend:latest
    container_name: osiedledesk-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
    networks:
      - admnet
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  admnet:
    driver: bridge

volumes:
  postgres_data:
