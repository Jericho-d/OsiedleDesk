server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        same-site: lax
        http-only: true

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/admtool}
    username: ${DB_USERNAME:admtool}
    password: ${DB_PASSWORD:admtool}
    driver-class-name: org.postgresql.Driver
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: public
  data:
    jdbc:
      repositories:
        enabled: true
  security:
    user:
      name: ${ADMIN_USERNAME:admin}
      password: ${ADMIN_PASSWORD:admin}
      roles: ADMINISTRATOR
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

admin:
  company-email: ${ADMIN_COMPANY_EMAIL:admin@example.com}

gmail:
  client-id: ${GMAIL_CLIENT_ID:}
  client-secret: ${GMAIL_CLIENT_SECRET:}
  refresh-token: ${GMAIL_REFRESH_TOKEN:}
  sender-email: ${GMAIL_SENDER_EMAIL:}
  application-name: OsiedleDesk

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging:
  level:
    org.springframework: INFO
    org.springframework.web: INFO
    com.administrativetool: DEBUG
    springframework.security: INFO
    org.springframework.jdbc: DEBUG
    liquibase: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
