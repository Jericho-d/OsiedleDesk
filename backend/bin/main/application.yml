server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        same-site: lax
        http-only: true

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/admtool}
    username: ${DB_USERNAME:admtool}
    password: ${DB_PASSWORD:admtool}
    driver-class-name: org.postgresql.Driver
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: public
  data:
    jdbc:
      repositories:
        enabled: true
  mail:
    host: ${SPRING_MAIL_HOST:smtp-mail.outlook.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          connectiontimeout: 5000
          timeout: 3000
          starttls:
            enable: true
            required: true
  security:
    user:
      name: ${ADMIN_USERNAME:admin}
      password: ${ADMIN_PASSWORD:admin}
      roles: ADMINISTRATOR
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

admin:
  company-email: ${ADMIN_COMPANY_EMAIL:admin@example.com}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging:
  level:
    org.springframework: INFO
    org.springframework.web: INFO
    com.administrativetool: DEBUG
    springframework.security: INFO
    org.springframework.jdbc: DEBUG
    liquibase: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
