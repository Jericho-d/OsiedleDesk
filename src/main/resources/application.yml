server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 30m

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/admtool}
    username: ${DB_USERNAME:admtool}
    password: ${DB_PASSWORD:admtool}
    driver-class-name: org.postgresql.Driver
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: public
  data:
    jdbc:
      repositories:
        enabled: true
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS:true}
          connectiontimeout: 5000
          timeout: 3000
          writetimeout: 5000
  security:
    user:
      name: ${ADMIN_USERNAME:admin}
      password: ${ADMIN_PASSWORD:admin}
      roles: ADMINISTRATOR
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

admin:
  company:
    email: ${ADMIN_COMPANY_EMAIL:admin@example.com}

logging:
  level:
    org.springframework: INFO
    org.springframework.web: INFO
    com.administrativetool: DEBUG
    springframework.security: INFO
    org.springframework.jdbc: DEBUG
    liquibase: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
