<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Issue Board - Issue Tracker</title>
    <link rel="stylesheet" th:href="@{/css/material.css}">
    <script src="https://unpkg.com/htmx.org@2.0.8"></script>
</head>
<body>
    <header class="md-app-bar">
        <span class="md-app-bar__title">Issue Board</span>
        <div class="md-app-bar__actions">
            <a th:href="@{/issues/new}" class="md-btn-new-issue">+ New Issue</a>
            <form th:action="@{/logout}" method="post" style="display: inline;">
                <button type="submit" class="md-btn-logout">Logout</button>
            </form>
        </div>
    </header>

    <div class="md-board">

        <!-- PREPARED Column -->
        <div class="md-column" id="column-prepared">
            <div class="md-column__header">📋 PREPARED</div>
            <div class="md-column__list" id="prepared-list"
                 hx-get="/fragments/board/column?status=PREPARED"
                 hx-trigger="load, every 5s">
                <div class="htmx-indicator">Loading...</div>
            </div>
        </div>

        <!-- IN_PROGRESS Column -->
        <div class="md-column" id="column-in-progress">
            <div class="md-column__header">🔄 IN PROGRESS</div>
            <div class="md-column__list" id="in-progress-list"
                 hx-get="/fragments/board/column?status=IN_PROGRESS"
                 hx-trigger="load, every 5s">
                <div class="htmx-indicator">Loading...</div>
            </div>
        </div>

        <!-- ACKNOWLEDGED Column -->
        <div class="md-column" id="column-acknowledged">
            <div class="md-column__header">👀 ACKNOWLEDGED</div>
            <div class="md-column__list" id="acknowledged-list"
                 hx-get="/fragments/board/column?status=ACKNOWLEDGED"
                 hx-trigger="load, every 5s">
                <div class="htmx-indicator">Loading...</div>
            </div>
        </div>

        <!-- RESOLVED Column -->
        <div class="md-column" id="column-resolved">
            <div class="md-column__header">✅ RESOLVED</div>
            <div class="md-column__list" id="resolved-list"
                 hx-get="/fragments/board/column?status=RESOLVED"
                 hx-trigger="load, every 5s">
                <div class="htmx-indicator">Loading...</div>
            </div>
        </div>

        <!-- WON'T_DO Column -->
        <div class="md-column" id="column-wont-do">
            <div class="md-column__header">🚫 WON'T DO</div>
            <div class="md-column__list" id="wont-do-list"
                 hx-get="/fragments/board/column?status=WONT_DO"
                 hx-trigger="load, every 5s">
                <div class="htmx-indicator">Loading...</div>
            </div>
        </div>
    </div>

    <!-- Modal container — populated by HTMX when a card is clicked -->
    <div id="issue-modal"></div>

    <!-- Toast notification container — populated out-of-band by HTMX on send errors -->
    <div id="toast-container" class="md-toast-container"></div>

    <script>
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                document.getElementById('issue-modal').innerHTML = '';
            }
        });
        document.addEventListener('click', function(e) {
            if (e.target && e.target.id === 'issue-modal-backdrop') {
                document.getElementById('issue-modal').innerHTML = '';
            }
        });
    </script>
</body>
</html>
