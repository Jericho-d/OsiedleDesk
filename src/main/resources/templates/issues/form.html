<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Issue - Issue Tracker</title>
    <link rel="stylesheet" th:href="@{/css/material.css}">
    <script src="https://unpkg.com/htmx.org@2.0.8"></script>
</head>
<body>
<header class="md-app-bar">
    <a th:href="@{/board}" class="md-app-bar__brand">
        <img th:src="@{/logo.png}" alt="OsiedleDesk" class="md-app-bar__logo">
    </a>
    <div class="md-app-bar__actions">
        <a th:href="@{/board}" class="md-btn-back">&#x2190; Back to Board</a>
    </div>
</header>

<div class="md-form-page">
    <div class="md-form-card">
        <form th:action="@{/issues}"
              method="post"
              th:object="${issue}"
              enctype="multipart/form-data">

            <div id="form-errors"></div>

            <div class="md-form-group">
                <label for="title">Title</label>
                <input type="text"
                       id="title"
                       name="title"
                       th:field="*{title}"
                       th:class="${#fields.hasErrors('title')} ? 'md-input md-input--error' : 'md-input'"
                       placeholder="Brief summary of the issue"
                       required>
                <div th:if="${#fields.hasErrors('title')}"
                     th:errors="*{title}"
                     class="md-error-message"></div>
                <div class="md-hint">Max 200 characters</div>
                <div class="md-char-count" id="title-count">0 / 200</div>
            </div>

            <div class="md-form-group">
                <label for="description">Description</label>
                <textarea id="description"
                          name="description"
                          th:field="*{description}"
                          th:class="${#fields.hasErrors('description')} ? 'md-input md-input--error' : 'md-input'"
                          placeholder="Detailed description of the issue..."
                          style="min-height: 150px; resize: vertical;"
                          required></textarea>
                <div th:if="${#fields.hasErrors('description')}"
                     th:errors="*{description}"
                     class="md-error-message"></div>
                <div class="md-hint">Max 2000 characters</div>
                <div class="md-char-count" id="desc-count">0 / 2000</div>
            </div>


            <div class="md-form-group">
                <label for="files">Attachments</label>
                <div class="md-file-upload" id="file-upload-area">
                    <input type="file"
                           id="files"
                           name="files"
                           multiple
                           class="md-file-input">
                    <div class="md-file-upload__placeholder">
                        <span class="md-file-upload__icon">&#x1F4CE;</span>
                        <span class="md-file-upload__text">Drop files here or click to browse</span>
                        <span class="md-file-upload__hint">Max 10 MB per file</span>
                    </div>
                </div>
                <div class="md-file-list" id="file-list"></div>
            </div>

            <div style="display: flex; gap: 1rem; margin-top: 2rem;">
                <button type="submit" class="md-btn-primary" style="width: auto;">
                    Create Issue
                </button>
                <a th:href="@{/board}" class="md-btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
<script>
    document.getElementById('title').addEventListener('input', function () {
        var count = this.value.length;
        var el = document.getElementById('title-count');
        el.textContent = count + ' / 200';
        el.className = 'md-char-count' + (count > 180 ? ' md-char-count--warn' : '') + (count > 200 ? ' md-char-count--error' : '');
    });
    document.getElementById('description').addEventListener('input', function () {
        var count = this.value.length;
        var el = document.getElementById('desc-count');
        el.textContent = count + ' / 2000';
        el.className = 'md-char-count' + (count > 1800 ? ' md-char-count--warn' : '') + (count > 2000 ? ' md-char-count--error' : '');
    });

    // File upload handling
    var fileInput = document.getElementById('files');
    var fileList = document.getElementById('file-list');

    fileInput.addEventListener('change', function () {
        fileList.innerHTML = '';
        var files = this.files;
        for (var i = 0; i < files.length; i++) {
            var file = files[i];
            var size = file.size < 1024 ? file.size + ' B'
                : file.size < 1048576 ? (file.size / 1024).toFixed(1) + ' KB'
                    : (file.size / 1048576).toFixed(1) + ' MB';
            var item = document.createElement('div');
            item.className = 'md-file-item';
            item.innerHTML = '<span class="md-file-item__name">&#x1F4C4; ' + file.name + '</span>'
                + '<span class="md-file-item__size">' + size + '</span>';
            fileList.appendChild(item);
        }
    });

    // Drag & drop visual feedback
    var uploadArea = document.getElementById('file-upload-area');
    ['dragenter', 'dragover'].forEach(function (evt) {
        uploadArea.addEventListener(evt, function (e) {
            e.preventDefault();
            uploadArea.classList.add('md-file-upload--dragover');
        });
    });
    ['dragleave', 'drop'].forEach(function (evt) {
        uploadArea.addEventListener(evt, function (e) {
            e.preventDefault();
            uploadArea.classList.remove('md-file-upload--dragover');
        });
    });
    uploadArea.addEventListener('drop', function (e) {
        fileInput.files = e.dataTransfer.files;
        fileInput.dispatchEvent(new Event('change'));
    });
</script>
</body>
</html>
