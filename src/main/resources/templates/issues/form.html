<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Issue - Issue Tracker</title>
    <link rel="stylesheet" th:href="@{/css/material.css}">
    <script src="https://unpkg.com/htmx.org@2.0.8"></script>
</head>
<body>
    <header class="md-app-bar">
        <span class="md-app-bar__title">Create Issue</span>
        <div class="md-app-bar__actions">
            <a th:href="@{/board}" class="md-btn-back">&#x2190; Back to Board</a>
        </div>
    </header>

    <div class="md-form-page">
        <div class="md-form-card">
            <form th:action="@{/issues}"
                  method="post"
                  th:object="${issue}"
                  hx-post="/issues"
                  hx-target="body"
                  hx-swap="none"
                  hx-on::after-request="if(event.detail.successful) { window.location.href = '/board'; }">

                <div id="form-errors"></div>

                <div class="md-form-group">
                    <label for="title">Title</label>
                    <input type="text"
                           id="title"
                           name="title"
                           th:field="*{title}"
                           th:class="${#fields.hasErrors('title')} ? 'md-input md-input--error' : 'md-input'"
                           placeholder="Brief summary of the issue"
                           required>
                    <div th:if="${#fields.hasErrors('title')}"
                         th:errors="*{title}"
                         class="md-error-message"></div>
                    <div class="md-hint">Max 200 characters</div>
                    <div class="md-char-count" id="title-count">0 / 200</div>
                </div>

                <div class="md-form-group">
                    <label for="description">Description</label>
                    <textarea id="description"
                              name="description"
                              th:field="*{description}"
                              th:class="${#fields.hasErrors('description')} ? 'md-input md-input--error' : 'md-input'"
                              placeholder="Detailed description of the issue..."
                              style="min-height: 150px; resize: vertical;"
                              required></textarea>
                    <div th:if="${#fields.hasErrors('description')}"
                         th:errors="*{description}"
                         class="md-error-message"></div>
                    <div class="md-hint">Max 2000 characters</div>
                    <div class="md-char-count" id="desc-count">0 / 2000</div>
                </div>

                <div class="md-form-group">
                    <label for="priority">Priority</label>
                    <select id="priority" name="priority" th:field="*{priority}" class="md-input">
                        <option value="LOW">Low</option>
                        <option value="MEDIUM" selected>Medium</option>
                        <option value="HIGH">High</option>
                        <option value="CRITICAL">Critical</option>
                    </select>
                </div>

                <div style="display: flex; gap: 1rem; margin-top: 2rem;">
                    <button type="submit" class="md-btn-primary" style="width: auto;">
                        <span class="htmx-indicator" style="display:none;">Creating...</span>
                        <span class="submit-text">Create Issue</span>
                    </button>
                    <a th:href="@{/board}" class="md-btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
    <script>
        document.getElementById('title').addEventListener('input', function() {
            var count = this.value.length;
            var el = document.getElementById('title-count');
            el.textContent = count + ' / 200';
            el.className = 'md-char-count' + (count > 180 ? ' md-char-count--warn' : '') + (count > 200 ? ' md-char-count--error' : '');
        });
        document.getElementById('description').addEventListener('input', function() {
            var count = this.value.length;
            var el = document.getElementById('desc-count');
            el.textContent = count + ' / 2000';
            el.className = 'md-char-count' + (count > 1800 ? ' md-char-count--warn' : '') + (count > 2000 ? ' md-char-count--error' : '');
        });
    </script>
</body>
</html>
