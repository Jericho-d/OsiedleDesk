<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Issue Tracker</title>
    <link rel="stylesheet" th:href="@{/css/material.css}">
</head>
<body class="md-login-page">
    <div class="md-login-card">
        <h1 class="md-login-card__title">OsiedleDesk</h1>
        <p class="md-login-card__subtitle">Property management issue tracking</p>

        <div th:if="${param.error}" class="md-alert md-alert--error">
            Invalid username or password.
        </div>

        <div th:if="${param.registered}" class="md-alert md-alert--success">
            Registration successful! Please log in.
        </div>

        <div th:if="${param.logout}" class="md-alert md-alert--success">
            You have been logged out.
        </div>

        <form th:action="@{/login}" method="post">
            <div class="md-form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" class="md-input" required autofocus>
            </div>

            <div class="md-form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" class="md-input" required>
            </div>

            <button type="submit" class="md-btn-primary">Log In</button>
        </form>
    </div>
</body>
</html>
