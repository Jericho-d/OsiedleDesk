<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<body>
<div th:fragment="issue-card" class="issue-card" th:id="'issue-' + ${issue.id}"
     tabindex="0"
     th:attr="hx-swap-oob=${oob != null ? 'outerHTML:#issue-' + issue.id : null}"
     th:data-issue-id="${issue.id}"
     th:data-status="${issue.status.name()}"
     th:style="'border-left-color: var(--ds-status-' + ${#strings.toLowerCase(issue.status.name())} + '-text)'">
    <div class="issue-card__title" th:text="${issue.title}">Issue Title</div>

    <div class="issue-card__footer">
        <div class="issue-card__footer-left">
            <span class="issue-card__id" th:text="'AT-' + ${issue.id}">AT-1</span>
            <div th:if="${issue.sent}" class="sent-badge">✓ Sent</div>
        </div>
        
        <div style="display: flex; align-items: center; gap: 8px;">
            <button th:if="${issue.status.name() == 'PREPARED' and !issue.sent}"
                    th:hx-post="@{'/api/issues/' + ${issue.id} + '/send'}"
                    hx-swap="none"
                    class="md-btn-send">
                ✉ Send
            </button>
            
        </div>
    </div>
    </div>

<th:block th:fragment="column-content">
    <th:block th:if="${#lists.isEmpty(issues)}">
        <div class="md-column__empty">
            <svg class="md-column__empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="32" height="32">
                <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
            </svg>
            <span>No issues</span>
        </div>
    </th:block>

    <th:block th:unless="${#lists.isEmpty(issues)}">
        <th:block th:each="issue : ${issues}" th:insert="~{fragments/issue-card :: issue-card}"></th:block>
    </th:block>
</th:block>
</body>
</html>
