<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
    <!-- Issue Card Fragment -->
    <div th:fragment="issue-card" class="issue-card" th:id="'issue-' + ${issue.id}"
         th:attr="hx-swap-oob=${oob != null ? 'outerHTML:#issue-' + issue.id : null}"
         th:hx-get="@{'/fragments/issues/' + ${issue.id} + '/detail'}"
         hx-target="#issue-modal"
         hx-swap="innerHTML">
        <div class="issue-card__title" th:text="${issue.title}">Issue Title</div>
        <div class="issue-card__description" th:text="${#strings.abbreviate(issue.description, 60)}">Description preview...</div>
        <div class="issue-card__footer">
            <span class="priority" th:class="'priority-' + ${issue.priority}" th:text="${issue.priority}">MEDIUM</span>
            <span class="issue-card__id" th:text="'#' + ${issue.id}">#1</span>
        </div>

        <!-- Admin Controls - Only visible to ADMIN role -->
        <div sec:authorize="hasRole('ADMINISTRATOR')" class="issue-card__actions" onclick="event.stopPropagation()">
            <!-- Send Button - Only for PREPARED status and not sent -->
            <button th:if="${issue.status.name() == 'PREPARED' and !issue.sent}"
                    th:hx-post="@{'/api/issues/' + ${issue.id} + '/send'}"
                    hx-swap="none"
                    class="btn-send">
                &#x1F4E7; Send
            </button>

            <!-- Sent Indicator -->
            <span th:if="${issue.sent}" class="sent-badge">
                &#x2713; SENT
            </span>
        </div>
    </div>

    <!-- Column Content Fragment -->
    <div th:fragment="column-content">
        <th:block th:if="${#lists.isEmpty(issues)}">
            <div class="md-column__empty">No issues</div>
        </th:block>

        <th:block th:unless="${#lists.isEmpty(issues)}">
            <div th:each="issue : ${issues}" th:insert="~{fragments/issue-card :: issue-card}"></div>
        </th:block>
    </div>
</body>
</html>
