<!doctype html>
<html>
  <head>
    <meta charset="UTF-8"/>
    <title>Login</title>
  </head>
  <body>
    <h2>Login</h2>
    <form method="post" action="/login">
      <div>
        <label>Username: <input name="username"/></label>
      </div>
      <div>
        <label>Password: <input type="password" name="password"/></label>
      </div>
      <div>
        <button type="submit">Login</button>
      </div>
    </form>
  </body>
  </html>
